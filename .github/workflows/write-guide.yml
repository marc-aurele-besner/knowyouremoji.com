name: Write Guide Post

on:
  schedule:
    # 1:30 AM Toronto/Montreal, weekdays (handles EDT/EST)
    - cron: '30 1 * * 1-5'
      timezone: America/Toronto
  workflow_dispatch:

jobs:
  write-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Optional: PAT from a different GitHub account so commits/PRs are
          # authored by that account instead of claude[bot]. The account needs
          # Write access; store a fine-grained PAT as WRITE_GUIDE_GITHUB_TOKEN.
          # token: ${{ secrets.WRITE_GUIDE_GITHUB_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          API_TIMEOUT_MS: 3000000
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          # Optional: attribute git commits and PRs to a different GitHub
          # account. Set bot_id with: gh api users/THE_USERNAME --jq .id
          # github_token: ${{ secrets.WRITE_GUIDE_GITHUB_TOKEN }}
          # bot_id: "12345678"
          # bot_name: "the-username"

          prompt: "In a new PR, write a new guide post. Go with your judgement on what is the best next post to write and don't ask me questions."
          show_full_output: true

          claude_args: |
            --dangerously-skip-permissions
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ secrets.ANTHROPIC_BASE_URL }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ANTHROPIC_AUTH_TOKEN }}",
                "API_TIMEOUT_MS": "3000000",
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
                "ANTHROPIC_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_SMALL_FAST_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ secrets.ANTHROPIC_MODEL }}"
              }
            }
