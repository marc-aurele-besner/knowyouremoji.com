name: Write Guide Post

on:
  schedule:
    # 1:30 AM Toronto/Montreal, weekdays (handles EDT/EST)
    - cron: '30 1 * * 1-5'
      timezone: America/Toronto
  workflow_dispatch:

jobs:
  write-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Optional: PAT from a different GitHub account so commits/PRs are
          # authored by that account instead of claude[bot]. The account needs
          # Write access; store a fine-grained PAT as WRITE_GUIDE_GITHUB_TOKEN.
          # token: ${{ secrets.WRITE_GUIDE_GITHUB_TOKEN }}

      - name: Snapshot remote branches
        run: git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$RUNNER_TEMP/branches-before.txt"

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          API_TIMEOUT_MS: 3000000
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          # Optional: attribute git commits and PRs to a different GitHub
          # account. Set bot_id with: gh api users/THE_USERNAME --jq .id
          # github_token: ${{ secrets.WRITE_GUIDE_GITHUB_TOKEN }}
          # bot_id: "12345678"
          # bot_name: "the-username"

          prompt: |
            Write a new guide post. Pick the best next topic yourself and do not ask questions.

            You must finish by opening a GitHub pull request with `gh pr create`.
            Do not stop after writing the file, committing, or pushing a branch.
            Do not leave only a compare URL. Before you finish, `gh pr view --json url`
            for that branch must return an open PR.
          show_full_output: true

          claude_args: |
            --dangerously-skip-permissions
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ secrets.ANTHROPIC_BASE_URL }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ANTHROPIC_AUTH_TOKEN }}",
                "API_TIMEOUT_MS": "3000000",
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
                "ANTHROPIC_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_SMALL_FAST_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ secrets.ANTHROPIC_MODEL }}"
              }
            }

      - name: Open a pull request if Claude skipped it
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token || github.token }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          has_work=false
          if [ -n "$(git status --porcelain)" ]; then
            has_work=true
          fi

          unpushed=false
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            unpushed=true
          fi

          if [ "$has_work" = true ] || [ "$unpushed" = true ]; then
            changed="$(git status --porcelain -- content/guides | awk '{print $NF; exit}')"
            slug=""
            if [ -n "${changed:-}" ]; then
              slug="$(basename "$changed" .md)"
            fi

            branch="${CLAUDE_BRANCH:-}"
            if [ -z "$branch" ] || [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
              if [ -n "$slug" ]; then
                branch="guide/${slug}"
              else
                branch="guide/write-guide-${RUN_ID}"
              fi
            fi

            current="$(git branch --show-current)"
            if [ "$current" = "main" ] || [ "$current" = "master" ] || [ -z "$current" ]; then
              git checkout -B "$branch"
            fi

            if [ "$has_work" = true ]; then
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "feat(guides): add scheduled guide post"
              fi
            fi

            git push -u origin HEAD
          fi

          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$RUNNER_TEMP/branches-after.txt"

          {
            comm -13 "$RUNNER_TEMP/branches-before.txt" "$RUNNER_TEMP/branches-after.txt" || true
            if [ -n "${CLAUDE_BRANCH:-}" ]; then
              printf '%s\n' "$CLAUDE_BRANCH"
            fi
          } | awk 'NF && $0 != "main" && $0 != "master"' | sort -u > "$RUNNER_TEMP/pr-candidates.txt"

          opened=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if [ -z "$(git ls-remote --heads origin "refs/heads/${branch}")" ]; then
              echo "Skipping ${branch} (not on origin)"
              continue
            fi
            number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$number" ]; then
              echo "PR #${number} already exists for ${branch}"
              opened=1
              continue
            fi
            gh pr create --head "$branch" --base main --fill
            opened=1
          done < "$RUNNER_TEMP/pr-candidates.txt"

          if [ "$opened" -eq 0 ]; then
            echo "::error::No pull request was opened. Claude must leave a pushed branch so this step can create one."
            exit 1
          fi
