name: Write Guide Post

on:
  schedule:
    # 1:30 AM Toronto/Montreal, weekdays (handles EDT/EST)
    - cron: '30 1 * * 1-5'
      timezone: America/Toronto
  workflow_dispatch:

jobs:
  write-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    env:
      GUIDE_BRANCH: guide/write-guide-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 1

      - name: Prepare guide branch
        id: prepare
        run: git switch --create "$GUIDE_BRANCH"

      - name: Write guide and open pull request
        id: claude
        # Recovery may finish the PR if the writer exits before publishing it.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          API_TIMEOUT_MS: 3000000
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          prompt: |
            Write one new guide post. Pick the best next topic yourself and do not ask questions.
            Read CLAUDE.md and existing content/guides posts for the format, quality bar,
            and validation commands. Avoid topics already covered by existing posts or open PRs.

            The workflow has checked out your working branch: ${{ env.GUIDE_BRANCH }}.
            Keep all work on that exact branch, targeting ${{ env.BASE_BRANCH }} in
            ${{ github.repository }}. Do not create another branch or push to the base branch.

            Publishing the PR is part of the task, not an optional follow-up. Complete all steps:
            1. Write the guide and run the relevant validation. Fix issues caused by your changes.
            2. Review the diff and commit only the intended guide changes.
            3. Push with `git push --set-upstream origin "${{ env.GUIDE_BRANCH }}"`.
            4. Check for an existing open PR:
               `gh pr list --repo "${{ github.repository }}" --head "${{ env.GUIDE_BRANCH }}" --base "${{ env.BASE_BRANCH }}" --state open --json url`.
               If none exists, write a PR body to a temporary file with the topic, changes,
               and validation results, then run `gh pr create` with explicit --repo,
               --head, --base, --title, and --body-file arguments. Reuse an existing PR.
            5. Run the same PR query again and confirm it returns an open PR URL.
               Do not treat a push, compare URL, or proposed command as completion.

            If a publishing command fails, inspect the error and retry after correcting it.
            Use the authentication supplied by this action; do not run interactive gh auth login.
            Finish with the verified PR URL and validation results. If blocked, report the
            exact failing command and error; do not claim a PR exists without verifying it.
          show_full_output: true
          claude_args: |
            --dangerously-skip-permissions
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ secrets.ANTHROPIC_BASE_URL }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ANTHROPIC_AUTH_TOKEN }}",
                "API_TIMEOUT_MS": "3000000",
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
                "ANTHROPIC_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_SMALL_FAST_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ secrets.ANTHROPIC_MODEL }}"
              }
            }

      - name: Check whether the guide PR exists
        id: check_pr
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          # Claude revokes its app token before the next workflow step runs.
          # The workflow token is sufficient for this read-only query.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(gh pr list --repo "$GH_REPO" --head "$GUIDE_BRANCH" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$url" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PR already open: $url"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Claude to recover the missing pull request
        if: ${{ !cancelled() && steps.check_pr.outputs.exists == 'false' }}
        # A new action invocation obtains a fresh app token for git/PR writes.
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          API_TIMEOUT_MS: 3000000
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          prompt: |
            Recover publication of the guide from the previous step in this same workspace.
            The required head branch is ${{ env.GUIDE_BRANCH }}, the base is
            ${{ env.BASE_BRANCH }}, and the repository is ${{ github.repository }}.
            Your task is to ensure an OPEN pull request exists for that exact head and base.

            First query `gh pr list` with explicit --repo, --head, --base, --state open,
            and --json url. If a PR already exists, report its URL and stop.

            Otherwise inspect git status, the current branch, local commits, and the remote
            branch. Preserve the previous step's work, including uncommitted guide files.
            Continue the existing guide; do not write a second guide or pick another topic.
            Read CLAUDE.md and validate any guide changes that still need committing.
            If there is no guide work to publish, report that explicitly and stop.

            Ensure the guide work is on ${{ env.GUIDE_BRANCH }}. Commit only intended guide
            changes if needed, then push that branch without force. Do not reset or discard
            work, push to the base branch, or create PRs for unrelated branches.

            Write a PR description to a temporary file with the topic, changes, and validation
            results. Run `gh pr create` with explicit --repo, --head, --base, --title, and
            --body-file arguments. If creation fails, inspect the error and check whether
            a PR was created before retrying. Use this action's fresh authentication;
            do not reuse a previous step's token or run interactive gh auth login.

            Before finishing, query the exact head/base again with --state open --json url
            and report the verified PR URL. A pushed branch or compare URL is not completion.
            If blocked, report the exact failing command and error.
          show_full_output: true
          claude_args: |
            --dangerously-skip-permissions
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ secrets.ANTHROPIC_BASE_URL }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ANTHROPIC_AUTH_TOKEN }}",
                "API_TIMEOUT_MS": "3000000",
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
                "ANTHROPIC_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_SMALL_FAST_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ secrets.ANTHROPIC_MODEL }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ secrets.ANTHROPIC_MODEL }}"
              }
            }

      - name: Verify an open guide pull request
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(gh pr list --repo "$GH_REPO" --head "$GUIDE_BRANCH" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$url" ]; then
            echo "::error::No open PR exists for $GUIDE_BRANCH against $BASE_BRANCH after Claude's publication attempt(s)."
            exit 1
          fi
          echo "Guide PR: $url"
          printf 'Guide pull request: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
